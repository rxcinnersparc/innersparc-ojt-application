<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Google tag (gtag.js) -->

    <script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Inner SPARC - OJT Portal</title>

    <!-- Favicon for browser tab -->
    <link rel="icon" type="image/png" href="/ojtportal.png">
    <link rel="shortcut icon" type="image/png" href="/ojtportal.png">
    
    <!-- For Apple devices -->
    <link rel="apple-touch-icon" href="/ojtportal.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f5fb;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        /* Minimal loading spinner */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f4f5fb;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.3s ease;
        }
        
        .loading-container.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #dde0f0;
            border-top-color: #222689;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #gas-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Error message */
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            max-width: 90%;
            width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border: 1px solid #f5c2c2;
            display: none;
            z-index: 10001;
        }
        
        .error-message.show {
            display: block;
        }

        /* Close (x) button */
        .close-button {
            position: absolute;
            top: 10px;
            right: 12px;
            background: transparent;
            border: none;
            font-size: 1.25rem;
            font-weight: bold;
            color: #7b7fa8;
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 50%;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .close-button:hover {
            color: #333;
            background: #f0f1f7;
        }
        
        .error-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .error-title {
            font-size: 1rem;
            font-weight: 800;
            color: #c0392b;
            margin-bottom: 8px;
        }
        
        .error-text {
            font-size: 0.75rem;
            color: #7b7fa8;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        
        .error-button {
            background: #222689;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.75rem;
        }
        
        .error-button:hover {
            background: #1a1d6e;
        }
    </style>
</head>
<body>    
    <!-- Minimal loading spinner -->
    <div class="loading-container" id="loadingContainer">
        <div class="loading-spinner"></div>
    </div>
    
    <div class="error-message" id="errorMessage">
        <button class="close-button" id="closeErrorModal" aria-label="Close error modal">&times;</button>
        <div class="error-icon">⚠️</div>
        <div class="error-title">Connection Error</div>
        <div class="error-text" id="errorText">
            Unable to load the application. Please check your internet connection and try again.
        </div>
        <button class="error-button" onclick="location.reload()">Retry</button>
    </div>
    
    <iframe id="gas-iframe" src="about:blank" allow="geolocation; clipboard-read; clipboard-write"></iframe>

    <script>
        // ============================================================
        // Inner SPARC — OJT Portal wrapper (ROLE-PREFIXED CLEAN URLS)
        //
        // Public URL forms on Vercel/GitHub Pages:
        //   INTERN
        //     /intern               → intern home
        //     /intern/apply         → intern apply
        //     /intern/attendance    → intern attendance
        //     /intern/documents     → intern documents
        //     /intern/faqs          → intern faqs
        //
        //   ADMIN
        //     /admin                → admin dashboard
        //     /admin/dashboard      → admin dashboard
        //     /admin/attendance     → admin attendance
        //     /admin/documents      → admin documents
        //     /admin/certificates   → admin certificates
        //     /admin/email          → admin email
        //
        // LEGACY SLUGS (still supported, auto-redirected where unambiguous):
        //   /home /apply /attendance /documents /faqs
        //   /dashboard /admin /certificates /email
        //
        // The wrapper doesn't enforce role — the GAS app does. If an
        // intern hits /admin/dashboard, GAS resolves it to their default
        // page and pushes a corrected URL back via portfolio:navigate.
        // ============================================================

        const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz6wScCaIGgqISRoPGuaZkz1pizQ0mjFa5iq7TvCgjcp3LVjhxYEsZkMSI0uv6VVhjT/exec';

        // ────────────────────────────────────────────────────────────
        // ROUTING VOCABULARY
        // ────────────────────────────────────────────────────────────

        // Internal page names the GAS app understands.
        const ROUTABLE = [
            'home', 'apply', 'attendance', 'documents', 'faqs',
            'admin', 'certificates', 'email'
        ];

        // Which pages belong to which role.
        const ROLE_PAGES = {
            intern: ['home', 'apply', 'attendance', 'documents', 'faqs'],
            admin:  ['admin', 'attendance', 'documents', 'certificates', 'email']
        };

        // Page → public slug under a role prefix.
        // NOTE: intern "home" → "" (i.e. /intern is the home).
        //       admin  "admin" → "dashboard" (nicer public name).
        const PAGE_TO_SLUG = {
            home:         '',
            apply:        'apply',
            attendance:   'attendance',
            documents:    'documents',
            faqs:         'faqs',
            admin:        'dashboard',
            certificates: 'certificates',
            email:        'email'
        };

        // Legacy (un-prefixed) slug → internal page name.
        // Used only for backward-compat redirects.
        const LEGACY_SLUG_TO_PAGE = {
            'home':         'home',
            'apply':        'apply',
            'attendance':   'attendance',
            'documents':    'documents',
            'faqs':         'faqs',
            'dashboard':    'admin',
            'admin':        'admin',
            'certificates': 'certificates',
            'email':        'email'
        };

        const iframe = document.getElementById('gas-iframe');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const loadingContainer = document.getElementById('loadingContainer');
        const closeErrorModal = document.getElementById('closeErrorModal');
        
        let hasLoaded = false;
        let loadTimeout;

        // ------------------------------------------------------------
        // Path ⇄ page translators (role-prefixed aware)
        //
        // Returns { role, page, legacy } where role is
        // 'intern' | 'admin' | null.
        //
        //   role:   detected role prefix from the URL (or null for legacy)
        //   page:   internal page name
        //   legacy: true when the path is an un-prefixed slug (candidate
        //           for redirect to the prefixed form)
        // ------------------------------------------------------------
        function parsePathname(pathname) {
            var clean = (pathname || '/').replace(/^\/+|\/+$/g, '').toLowerCase();
            if (!clean || clean === 'index.html') {
                return { role: null, page: 'home', legacy: true };
            }

            var parts = clean.split('/');
            var first = parts[0];
            var second = parts.slice(1).join('/');

            // ── New scheme: /intern/* or /admin/* ──
            if (first === 'intern') {
                if (!second) return { role: 'intern', page: 'home', legacy: false };
                var internSlugMap = {
                    'home': 'home', 'apply': 'apply',
                    'attendance': 'attendance', 'documents': 'documents',
                    'faqs': 'faqs'
                };
                if (internSlugMap[second]) {
                    return { role: 'intern', page: internSlugMap[second], legacy: false };
                }
                // Unknown /intern/xxx → fall back to /intern (home)
                return { role: 'intern', page: 'home', legacy: false };
            }
            if (first === 'admin') {
                if (!second) return { role: 'admin', page: 'admin', legacy: false };
                var adminSlugMap = {
                    'dashboard': 'admin', 'attendance': 'attendance',
                    'documents': 'documents', 'certificates': 'certificates',
                    'email': 'email'
                };
                if (adminSlugMap[second]) {
                    return { role: 'admin', page: adminSlugMap[second], legacy: false };
                }
                // Unknown /admin/xxx → fall back to /admin (dashboard)
                return { role: 'admin', page: 'admin', legacy: false };
            }

            // ── Legacy scheme: /home, /dashboard, etc. ──
            if (LEGACY_SLUG_TO_PAGE[first]) {
                return { role: null, page: LEGACY_SLUG_TO_PAGE[first], legacy: true };
            }

            // Unknown path → default to intern home (legacy flag on)
            return { role: null, page: 'home', legacy: true };
        }

        // Convenience: just the internal page name (used by GAS handshake).
        function pathnameToPage(pathname) {
            return parsePathname(pathname).page;
        }

        // Build a role-prefixed pathname for a given page + role.
        // If role is unknown, falls back to the legacy un-prefixed slug.
        function pageToPathname(page, role) {
            var p = (page || '').toString().trim().toLowerCase();
            if (!p) p = 'home';

            var slug = PAGE_TO_SLUG[p];
            if (slug === undefined) slug = p;   // unknown page — pass through

            if (role === 'intern' || role === 'admin') {
                // /intern  for intern home; /admin/dashboard for admin.
                if (role === 'intern' && slug === '') return '/intern';
                return '/' + role + (slug ? '/' + slug : '');
            }

            // No role known — legacy form
            if (p === 'home') return '/';
            // Prefer the friendlier "dashboard" for admin page
            if (p === 'admin') return '/dashboard';
            return '/' + slug;
        }

        // ------------------------------------------------------------
        // Cache the initial page from the URL.
        //
        // CRITICAL: We must read this BEFORE the wrapper starts doing
        // any pushState/replaceState. Otherwise, by the time GAS sends
        // "portfolio:ready", the current URL may already have been
        // rewritten by a buggy first render (e.g. GAS defaulting to
        // "admin" and posting portfolio:navigate back up, which would
        // make window.location.pathname read "/dashboard" instead of
        // the "/documents" the user actually pasted).
        //
        // By freezing it here, the wrapper remembers the ORIGINAL
        // intent and can force GAS onto the right page via the
        // portfolio:popstate handshake, regardless of what URL GAS
        // has pushed so far.
        //
        // IMPORTANT — special case for the root URL ("/"):
        //   When the user lands on "/", we DON'T know what page they
        //   should actually see. It depends on their role and OJT
        //   status, both of which only GAS can determine. So we must
        //   NOT force a handshake in that case — GAS's own role-based
        //   resolution ("Ongoing intern → attendance", "Admin →
        //   admin", etc.) is the correct authority.
        //
        //   If we DID force the handshake, we'd send GAS back to
        //   "home" right after it landed on "attendance", producing
        //   exactly the regression we saw.
        //
        //   So: only run the handshake when the user pasted a URL
        //   with a SPECIFIC, non-root page.
        // ------------------------------------------------------------
        const INITIAL_PARSE = parsePathname(window.location.pathname);
        const INITIAL_PAGE_FROM_URL = INITIAL_PARSE.page;
        const INITIAL_ROLE_FROM_URL = INITIAL_PARSE.role;
        const SHOULD_FORCE_HANDSHAKE =
            INITIAL_PAGE_FROM_URL &&
            INITIAL_PAGE_FROM_URL !== 'home';
        console.log(
            '[Wrapper] Initial page from URL:',
            INITIAL_PAGE_FROM_URL,
            '| role:',
            INITIAL_ROLE_FROM_URL,
            '| force handshake:',
            SHOULD_FORCE_HANDSHAKE
        );

        // ------------------------------------------------------------
        // Legacy-slug redirect: /dashboard → /admin/dashboard, etc.
        // Runs BEFORE iframe creation so GAS gets the correct ?page=.
        // Uses replaceState so no extra history entry is created.
        // ------------------------------------------------------------
        (function migrateLegacyPaths() {
            try {
                var parsed = parsePathname(window.location.pathname);
                if (!parsed.legacy) return;   // already prefixed — nothing to do

                // Don't redirect the root "/" — GAS owns role resolution there.
                var clean = (window.location.pathname || '/').replace(/^\/+|\/+$/g, '').toLowerCase();
                if (!clean || clean === 'index.html') return;

                // Decide the prefix. If the legacy slug is unambiguously
                // admin-only, use admin; if intern-only, use intern.
                // Otherwise, let the GAS app decide (keep legacy path,
                // GAS will push a corrected URL via portfolio:navigate).
                var adminOnlyPages  = ['admin', 'certificates', 'email'];
                var internOnlyPages = ['home', 'apply', 'faqs'];

                var role = null;
                if (adminOnlyPages.indexOf(parsed.page) !== -1)  role = 'admin';
                if (internOnlyPages.indexOf(parsed.page) !== -1) role = 'intern';

                // Shared pages (attendance/documents) — leave unprefixed.
                // GAS will resolve role and push the correct prefixed URL.
                if (!role) return;

                var newPath = pageToPathname(parsed.page, role);
                if (newPath === window.location.pathname) return;

                window.history.replaceState(
                    { page: parsed.page, role: role },
                    '',
                    newPath + window.location.search + window.location.hash
                );
            } catch (e) { /* ignore */ }
        })();

        // ------------------------------------------------------------
        // Legacy ?page=... query string → redirect to prefixed path.
        // ------------------------------------------------------------
        (function migrateLegacyQueryString() {
            try {
                var params = new URLSearchParams(window.location.search);
                var legacy = params.get('page');
                if (!legacy) return;

                var internal = LEGACY_SLUG_TO_PAGE[legacy] || legacy;
                // Guess role from unambiguous slugs; otherwise just
                // leave the internal page name in the URL for GAS to
                // correct via portfolio:navigate.
                var adminOnly  = ['admin', 'certificates', 'email'];
                var internOnly = ['home', 'apply', 'faqs'];
                var role = null;
                if (adminOnly.indexOf(internal) !== -1)  role = 'admin';
                if (internOnly.indexOf(internal) !== -1) role = 'intern';

                var cleanPath = pageToPathname(internal, role);
                params.delete('page');
                var tail = params.toString();
                var newUrl = cleanPath + (tail ? ('?' + tail) : '');
                window.history.replaceState({ page: internal, role: role }, '', newUrl);
            } catch (e) { /* ignore */ }
        })();

        // ------------------------------------------------------------
        // Error modal helpers
        // ------------------------------------------------------------
        function hideError() {
            errorMessage.classList.remove('show');
        }

        closeErrorModal.addEventListener('click', hideError);

        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && errorMessage.classList.contains('show')) {
                hideError();
            }
        });

        function showError(message) {
            if (hasLoaded) return;
            clearTimeout(loadTimeout);
            loadingContainer.classList.add('hidden');
            errorText.textContent = message || 'Unable to load the application. Please check your internet connection and try again.';
            errorMessage.classList.add('show');
        }
        
        function onIframeLoad() {
            if (hasLoaded) return;
            clearTimeout(loadTimeout);
            hasLoaded = true;
            loadingContainer.classList.add('hidden');
            setTimeout(() => {
                loadingContainer.style.display = 'none';
            }, 300);
        }
        
        function onIframeError() {
            if (hasLoaded) return;
            showError('Failed to load the application. The Google Apps Script web app might be unavailable or the URL is incorrect.');
        }

        iframe.addEventListener('load', onIframeLoad);
        iframe.addEventListener('error', onIframeError);

        // ------------------------------------------------------------
        // Build the iframe src from the current window.location.
        // The GAS app speaks ?page= internally. We send the internal
        // page name; GAS decides what to do with it based on role.
        // ------------------------------------------------------------
        function buildIframeUrl() {
            var page = pathnameToPage(window.location.pathname);
            var url = new URL(GAS_WEBAPP_URL);
            if (page && page !== 'home') url.searchParams.set('page', page);

            // Forward unrelated query params (utm_*, etc.) untouched.
            var incoming = new URLSearchParams(window.location.search);
            incoming.forEach(function (value, key) {
                if (key === 'page') return;
                url.searchParams.set(key, value);
            });

            return url.toString();
        }

        const iframeUrl = buildIframeUrl();
        iframe.src = iframeUrl;

        loadTimeout = setTimeout(() => {
            if (!hasLoaded) {
                showError('Loading timeout. The application is taking too long to respond. Please try again.');
            }
        }, 15000);

        // ------------------------------------------------------------
        // Track readiness so we can buffer early popstates.
        // ------------------------------------------------------------
        let iframeReady = false;
        let pendingPage = null;

        function isTrustedOrigin(origin) {
            if (!origin || origin === 'null') return true;
            return origin === 'https://script.google.com' ||
                   origin === 'https://script.googleusercontent.com' ||
                   origin.indexOf('.googleusercontent.com') !== -1 ||
                   origin.indexOf('.google.com') !== -1;
        }

        // ------------------------------------------------------------
        // Messages coming FROM the embedded GAS app.
        // ------------------------------------------------------------
        window.addEventListener('message', function (event) {
            if (event.source === window) return;
            if (!isTrustedOrigin(event.origin)) return;

            const data = event.data;
            if (!data || !data.type) return;

            // Click / role-corrected navigation: create a new history entry.
            // GAS may include `role` ('intern' | 'admin') so we can build
            // the correctly-prefixed public URL.
            if (data.type === 'portfolio:navigate') {
                const page = (data.page || 'home').toString();
                const role = (data.role === 'intern' || data.role === 'admin')
                    ? data.role
                    : null;

                const newPath = pageToPathname(page, role);

                const url = new URL(window.location.href);
                url.pathname = newPath;
                url.searchParams.delete('page');

                const target = url.pathname + (url.search || '') + url.hash;
                const current = window.location.pathname + window.location.search + window.location.hash;

                if (target !== current) {
                    if (data.replace) {
                        window.history.replaceState({ page: page, role: role }, '', target);
                    } else {
                        window.history.pushState({ page: page, role: role }, '', target);
                    }
                }

                if (data.title) document.title = data.title;
                return;
            }

            // Scroll spy: update URL silently
            if (data.type === 'portfolio:section') {
                const page = (data.page || 'home').toString();
                const role = (data.role === 'intern' || data.role === 'admin')
                    ? data.role
                    : null;
                const newPath = pageToPathname(page, role);

                const url = new URL(window.location.href);
                url.pathname = newPath;
                url.searchParams.delete('page');

                const target = url.pathname + (url.search || '') + url.hash;
                const current = window.location.pathname + window.location.search + window.location.hash;

                if (target !== current) {
                    window.history.replaceState({ page: page, role: role }, '', target);
                }

                if (data.title) document.title = data.title;
                return;
            }

            if (data.type === 'portfolio:setTitle') {
                if (data.title) document.title = data.title;
                return;
            }

            if (data.type === 'portfolio:ready') {
                iframeReady = true;

                // ------------------------------------------------------------
                // Decide whether to run the popstate handshake at all.
                //
                // We ONLY hand a page back to GAS when we have a
                // specific, non-root URL that we know the user asked
                // for. In that case, if GAS booted to the wrong page
                // (e.g. its role-default), our cached value corrects it.
                //
                // We do NOT hand anything back when:
                //   - INITIAL_PAGE_FROM_URL is 'home' (user hit the root)
                //     GAS's role-aware resolution is authoritative. An
                //     Ongoing intern correctly lands on 'attendance',
                //     and we must not stomp that with 'home'.
                //   - AND there's no buffered popstate either. A buffered
                //     popstate means the user hit Back/Forward before
                //     GAS was ready, which IS a specific intent we
                //     should honor.
                // ------------------------------------------------------------
                const hasBuffered = (pendingPage !== null);
                const shouldHandshake = hasBuffered || SHOULD_FORCE_HANDSHAKE;

                if (!shouldHandshake) {
                    console.log(
                        '[Wrapper] portfolio:ready → no handshake needed ' +
                        '(root load; GAS role-resolution is authoritative).'
                    );
                    pendingPage = null;
                    return;
                }

                // Priority order for the page to hand back to GAS:
                //   1. Buffered popstate target (user hit Back/Forward
                //      before GAS finished booting) — wins because it's
                //      the most recent user intent.
                //   2. The cached initial page from a SPECIFIC URL the
                //      user pasted at cold-load time. Immune to any URL
                //      rewrites GAS may have done during its own boot.
                //   3. Live pathname as a last-ditch fallback.
                let initial;
                if (hasBuffered) {
                    initial = pendingPage;
                } else if (SHOULD_FORCE_HANDSHAKE) {
                    initial = INITIAL_PAGE_FROM_URL;
                } else {
                    initial = pathnameToPage(window.location.pathname);
                }
                pendingPage = null;

                console.log('[Wrapper] portfolio:ready → handshake page =', initial);

                // Fan out to every nested frame level.
                function relayReady(win, depth) {
                    if (!win || depth > 6) return;
                    try {
                        win.postMessage(
                            { type: 'portfolio:popstate', page: initial },
                            '*'
                        );
                    } catch (e) {}
                    try {
                        for (let i = 0; i < win.frames.length; i++) {
                            relayReady(win.frames[i], depth + 1);
                        }
                    } catch (e) {}
                }

                relayReady(iframe.contentWindow, 0);
                return;
            }
        });

        // ------------------------------------------------------------
        // Browser back / forward → tell the iframe to re-route.
        // ------------------------------------------------------------
        window.addEventListener('popstate', function () {
            const page = pathnameToPage(window.location.pathname);

            if (!iframeReady) {
                pendingPage = page;
                return;
            }

            function relay(win, depth) {
                if (!win || depth > 6) return;
                try { win.postMessage({ type: 'portfolio:popstate', page: page }, '*'); } catch (e) {}
                try {
                    for (let i = 0; i < win.frames.length; i++) {
                        relay(win.frames[i], depth + 1);
                    }
                } catch (e) {}
            }

            relay(iframe.contentWindow, 0);
        });

        // Log successful setup (for debugging)
        console.log('OJT Portal wrapper loaded. Iframe URL:', iframeUrl);
    </script>
</body>
</html>
