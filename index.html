<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Inner SPARC - OJT Portal</title>

    <!-- Favicon for browser tab -->
    <link rel="icon" type="image/png" href="https://i.imgur.com/TcCQCER.png">
    <link rel="shortcut icon" type="image/png" href="https://i.imgur.com/TcCQCER.png">
    
    <!-- For Apple devices -->
    <link rel="apple-touch-icon" href="https://i.imgur.com/TcCQCER.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f5fb;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        /* Minimal loading spinner */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f4f5fb;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.3s ease;
        }
        
        .loading-container.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #dde0f0;
            border-top-color: #222689;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #gas-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Error message */
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            max-width: 90%;
            width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border: 1px solid #f5c2c2;
            display: none;
            z-index: 10001;
        }
        
        .error-message.show {
            display: block;
        }

        /* Close (x) button */
        .close-button {
            position: absolute;
            top: 10px;
            right: 12px;
            background: transparent;
            border: none;
            font-size: 1.25rem;
            font-weight: bold;
            color: #7b7fa8;
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 50%;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .close-button:hover {
            color: #333;
            background: #f0f1f7;
        }
        
        .error-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .error-title {
            font-size: 1rem;
            font-weight: 800;
            color: #c0392b;
            margin-bottom: 8px;
        }
        
        .error-text {
            font-size: 0.75rem;
            color: #7b7fa8;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        
        .error-button {
            background: #222689;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.75rem;
        }
        
        .error-button:hover {
            background: #1a1d6e;
        }
    </style>
</head>
<body>    
    <!-- Minimal loading spinner -->
    <div class="loading-container" id="loadingContainer">
        <div class="loading-spinner"></div>
    </div>
    
    <div class="error-message" id="errorMessage">
        <button class="close-button" id="closeErrorModal" aria-label="Close error modal">&times;</button>
        <div class="error-icon">⚠️</div>
        <div class="error-title">Connection Error</div>
        <div class="error-text" id="errorText">
            Unable to load the application. Please check your internet connection and try again.
        </div>
        <button class="error-button" onclick="location.reload()">Retry</button>
    </div>
    
    <iframe id="gas-iframe" src="about:blank" allow="geolocation; clipboard-read; clipboard-write"></iframe>

    <script>
        // ============================================================
        // Inner SPARC — OJT Portal wrapper (CLEAN URLS)
        //
        // Public URL forms on Vercel/GitHub Pages:
        //   /              → home (intern)        / dashboard (admin)
        //   /dashboard     → admin
        //   /apply         → apply    (intern)
        //   /attendance    → attendance
        //   /documents     → documents
        //   /faqs          → faqs     (intern)
        //   /certificates  → certificates (admin)
        //   /email         → email    (admin)
        //
        // The wrapper doesn't enforce role — the GAS app does. If an
        // intern hits /dashboard, GAS resolves it to their default
        // page (attendance or home) and pushes a corrected URL back.
        // ============================================================

        const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz6wScCaIGgqISRoPGuaZkz1pizQ0mjFa5iq7TvCgjcp3LVjhxYEsZkMSI0uv6VVhjT/exec';

        // Public URL slugs recognized by the wrapper.
        const ROUTABLE = [
            'home', 'apply', 'attendance', 'documents', 'faqs',
            'dashboard', 'admin', 'certificates', 'email'
        ];

        // Public slug  →  internal page name.
        // Note: "dashboard" is the public name for the internal page "admin"
        //       (the "admin" page is the Dashboard tab in the app).
        const PATH_TO_PAGE = {
            'home':         'home',
            'apply':        'apply',
            'attendance':   'attendance',
            'documents':    'documents',
            'faqs':         'faqs',
            'dashboard':    'admin',
            'admin':        'admin',
            'certificates': 'certificates',
            'email':        'email'
        };

        // Internal page name → public slug.
        // "admin" maps to "dashboard" — we prefer the more descriptive
        // public slug so the URL bar reads "/dashboard" instead of "/admin".
        const PAGE_TO_PATH = {
            'home':         'home',
            'apply':        'apply',
            'attendance':   'attendance',
            'documents':    'documents',
            'faqs':         'faqs',
            'admin':        'dashboard',
            'certificates': 'certificates',
            'email':        'email'
        };

        const iframe = document.getElementById('gas-iframe');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const loadingContainer = document.getElementById('loadingContainer');
        const closeErrorModal = document.getElementById('closeErrorModal');
        
        let hasLoaded = false;
        let loadTimeout;

        // ------------------------------------------------------------
        // Path ⇄ page translators
        // ------------------------------------------------------------
        function pathnameToPage(pathname) {
            var p = (pathname || '/').replace(/^\/+|\/+$/g, '').toLowerCase();
            if (!p || p === 'index.html') return 'home';
            if (ROUTABLE.indexOf(p) === -1) return 'home';
            return PATH_TO_PAGE[p] || 'home';
        }

        function pageToPathname(page) {
            var p = (page || '').toString().trim().toLowerCase();
            if (!p || p === 'home') return '/';
            var slug = PAGE_TO_PATH[p];
            if (!slug) return '/';
            return '/' + slug;
        }

        // ------------------------------------------------------------
        // Build the iframe src from the current window.location.
        // The GAS app speaks ?page= internally. We send the internal
        // page name; GAS decides what to do with it based on role.
        // ------------------------------------------------------------
        function buildIframeUrl() {
            var page = pathnameToPage(window.location.pathname);
            var url = new URL(GAS_WEBAPP_URL);
            if (page && page !== 'home') url.searchParams.set('page', page);

            // Forward unrelated query params (utm_*, etc.) untouched.
            var incoming = new URLSearchParams(window.location.search);
            incoming.forEach(function (value, key) {
                if (key === 'page') return;
                url.searchParams.set(key, value);
            });

            return url.toString();
        }

        // ------------------------------------------------------------
        // Legacy redirect: /?page=dashboard → /dashboard
        // ------------------------------------------------------------
        (function migrateLegacyQueryString() {
            try {
                var params = new URLSearchParams(window.location.search);
                var legacy = params.get('page');
                if (!legacy) return;

                var cleanPath = pageToPathname(legacy);
                params.delete('page');
                var tail = params.toString();
                var newUrl = cleanPath + (tail ? ('?' + tail) : '');
                window.history.replaceState({ page: legacy }, '', newUrl);
            } catch (e) { /* ignore */ }
        })();

        // ------------------------------------------------------------
        // Error modal helpers
        // ------------------------------------------------------------
        function hideError() {
            errorMessage.classList.remove('show');
        }

        closeErrorModal.addEventListener('click', hideError);

        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && errorMessage.classList.contains('show')) {
                hideError();
            }
        });

        function showError(message) {
            if (hasLoaded) return;
            clearTimeout(loadTimeout);
            loadingContainer.classList.add('hidden');
            errorText.textContent = message || 'Unable to load the application. Please check your internet connection and try again.';
            errorMessage.classList.add('show');
        }
        
        function onIframeLoad() {
            if (hasLoaded) return;
            clearTimeout(loadTimeout);
            hasLoaded = true;
            loadingContainer.classList.add('hidden');
            setTimeout(() => {
                loadingContainer.style.display = 'none';
            }, 300);
        }
        
        function onIframeError() {
            if (hasLoaded) return;
            showError('Failed to load the application. The Google Apps Script web app might be unavailable or the URL is incorrect.');
        }

        iframe.addEventListener('load', onIframeLoad);
        iframe.addEventListener('error', onIframeError);

        const iframeUrl = buildIframeUrl();
        iframe.src = iframeUrl;

        loadTimeout = setTimeout(() => {
            if (!hasLoaded) {
                showError('Loading timeout. The application is taking too long to respond. Please try again.');
            }
        }, 15000);

        // ------------------------------------------------------------
        // Track readiness so we can buffer early popstates.
        // ------------------------------------------------------------
        let iframeReady = false;
        let pendingPage = null;

        function isTrustedOrigin(origin) {
            if (!origin || origin === 'null') return true;
            return origin === 'https://script.google.com' ||
                   origin === 'https://script.googleusercontent.com' ||
                   origin.indexOf('.googleusercontent.com') !== -1 ||
                   origin.indexOf('.google.com') !== -1;
        }

        // ------------------------------------------------------------
        // Messages coming FROM the embedded GAS app.
        // ------------------------------------------------------------
        window.addEventListener('message', function (event) {
            if (event.source === window) return;
            if (!isTrustedOrigin(event.origin)) return;

            const data = event.data;
            if (!data || !data.type) return;

            // Click / role-corrected navigation: create a new history entry
            if (data.type === 'portfolio:navigate') {
                const page = (data.page || 'home').toString();
                const newPath = pageToPathname(page);

                const url = new URL(window.location.href);
                url.pathname = newPath;
                url.searchParams.delete('page');

                const target = url.pathname + (url.search || '') + url.hash;
                const current = window.location.pathname + window.location.search + window.location.hash;

                if (target !== current) {
                    if (data.replace) {
                        window.history.replaceState({ page: page }, '', target);
                    } else {
                        window.history.pushState({ page: page }, '', target);
                    }
                }

                if (data.title) document.title = data.title;
                return;
            }

            // Scroll spy: update URL silently
            if (data.type === 'portfolio:section') {
                const page = (data.page || 'home').toString();
                const newPath = pageToPathname(page);

                const url = new URL(window.location.href);
                url.pathname = newPath;
                url.searchParams.delete('page');

                const target = url.pathname + (url.search || '') + url.hash;
                const current = window.location.pathname + window.location.search + window.location.hash;

                if (target !== current) {
                    window.history.replaceState({ page: page }, '', target);
                }

                if (data.title) document.title = data.title;
                return;
            }

            if (data.type === 'portfolio:setTitle') {
                if (data.title) document.title = data.title;
                return;
            }

            if (data.type === 'portfolio:ready') {
                iframeReady = true;

                // Prefer the buffered page over the current URL — the
                // buffered value is what the user actually asked for.
                const initial = pendingPage !== null
                    ? pendingPage
                    : pathnameToPage(window.location.pathname);
                pendingPage = null;

                // Fan out to every nested frame level.
                function relayReady(win, depth) {
                    if (!win || depth > 6) return;
                    try {
                        win.postMessage(
                            { type: 'portfolio:popstate', page: initial },
                            '*'
                        );
                    } catch (e) {}
                    try {
                        for (let i = 0; i < win.frames.length; i++) {
                            relayReady(win.frames[i], depth + 1);
                        }
                    } catch (e) {}
                }

                relayReady(iframe.contentWindow, 0);
                return;
            }
        });

        // ------------------------------------------------------------
        // Browser back / forward → tell the iframe to re-route.
        // ------------------------------------------------------------
        window.addEventListener('popstate', function () {
            const page = pathnameToPage(window.location.pathname);

            if (!iframeReady) {
                pendingPage = page;
                return;
            }

            function relay(win, depth) {
                if (!win || depth > 6) return;
                try { win.postMessage({ type: 'portfolio:popstate', page: page }, '*'); } catch (e) {}
                try {
                    for (let i = 0; i < win.frames.length; i++) {
                        relay(win.frames[i], depth + 1);
                    }
                } catch (e) {}
            }

            relay(iframe.contentWindow, 0);
        });

        // Log successful setup (for debugging)
        console.log('OJT Portal wrapper loaded. Iframe URL:', iframeUrl);
    </script>
</body>
</html>
